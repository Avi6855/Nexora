apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: nexora
  labels:
    app.kubernetes.io/name: envoy
    app.kubernetes.io/part-of: nexora
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: admin
      port: 9901
      targetPort: 9901
      protocol: TCP
  selector:
    app.kubernetes.io/name: envoy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: nexora
  labels:
    app.kubernetes.io/name: envoy
    app.kubernetes.io/part-of: nexora
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: main_listener
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8000
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    codec_type: AUTO
                    stat_prefix: ingress_http
                    use_remote_address: true
                    generate_request_id: true
                    common_http_protocol_options:
                      idle_timeout: 300s
                    request_timeout: 30s
                    stream_idle_timeout: 300s
                    typed_per_filter_config:
                      type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    http_filters:
                      - name: envoy.filters.http.cors
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                      - name: envoy.filters.http.jwt_authn
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                          providers:
                            nexora_jwt:
                              issuer: nexora
                              audiences:
                                - nexora-api
                              remote_jwks:
                                http_uri:
                                  uri: http://identity-service.nexora.svc.cluster.local:8081/.well-known/jwks.json
                                  cluster: identity_service
                                  timeout: 5s
                          rules:
                            - match:
                                prefix: /v1/auth/verify
                              requires:
                                provider_and_audiences:
                                  provider_name: nexora_jwt
                                  audiences:
                                    - nexora-api
                            - match:
                                prefix: /v1/auth/token
                              requires: false
                            - match:
                                prefix: /v1/auth/
                              requires: false
                            - match:
                                prefix: /v1/auth/refresh
                              requires: false
                            - match:
                                prefix: /v1/health
                              requires: false
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          retry_policy:
                            retry_on: "503"
                            num_retries: 2
                            per_try_timeout: 10s
                            retry_back_off:
                              base_interval: 0.1s
                              max_interval: 1s
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: /v1/auth/
                              route:
                                cluster: identity_service
                                timeout: 30s
                            - match:
                                prefix: /v1/users/
                              route:
                                cluster: user_service
                                timeout: 30s
                            - match:
                                prefix: /v1/accounts/
                              route:
                                cluster: account_service
                                timeout: 30s
                            - match:
                                prefix: /v1/ledger/
                              route:
                                cluster: ledger_service
                                timeout: 30s
                            - match:
                                prefix: /v1/payments/
                              route:
                                cluster: payment_service
                                timeout: 120s
                                retry_policy:
                                  retry_on: "503"
                                  num_retries: 2
                                  per_try_timeout: 30s
                            - match:
                                prefix: /v1/transfers/
                              route:
                                cluster: transfer_service
                                timeout: 120s
                                retry_policy:
                                  retry_on: "503"
                                  num_retries: 2
                                  per_try_timeout: 30s
                            - match:
                                prefix: /v1/cards/
                              route:
                                cluster: card_service
                                timeout: 30s
                            - match:
                                prefix: /v1/pots/
                              route:
                                cluster: pot_service
                                timeout: 30s
                            - match:
                                prefix: /v1/notifications/
                              route:
                                cluster: notification_service
                                timeout: 30s
                            - match:
                                prefix: /v1/security/
                              route:
                                cluster: control_plane_service
                                timeout: 30s
                            - match:
                                prefix: /v1/engineering/
                              route:
                                cluster: replay_service
                                timeout: 30s
                            - match:
                                prefix: /v1/simulations/
                              route:
                                cluster: simulation_service
                                timeout: 60s
                            - match:
                                prefix: /v1/policies/
                              route:
                                cluster: policy_service
                                timeout: 30s
                            - match:
                                prefix: /v1/reconciliation/
                              route:
                                cluster: reconciliation_service
                                timeout: 60s
                            - match:
                                prefix: /v1/incidents/
                              route:
                                cluster: incident_service
                                timeout: 30s
                            - match:
                                prefix: /v1/chaos/
                              route:
                                cluster: simulation_service
                                timeout: 60s
                            - match:
                                prefix: /v1/health
                              route:
                                cluster: control_plane_service
                                timeout: 5s
                            - match:
                                prefix: /
                              direct_response:
                                status_code: 404
                                body:
                                  inline_string: '{"error":"not_found","message":"The requested endpoint does not exist."}'
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              timestamp: "%START_TIME%"
                              request_id: "%REQ(x-request-id)%"
                              method: "%REQ(:METHOD)%"
                              path: "%REQ(:PATH)%"
                              protocol: "%PROTOCOL%"
                              response_code: "%RESPONSE_CODE%"
                              response_flags: "%RESPONSE_FLAGS%"
                              duration_ms: "%DURATION%"
                              upstream_cluster: "%UPSTREAM_CLUSTER%"
                              upstream_host: "%UPSTREAM_HOST%"
                              request_size: "%BYTES_RECEIVED%"
                              response_size: "%BYTES_SENT%"
                              user_agent: "%REQ(USER-AGENT)%"
                              source_ip: "%DOWNSTREAM_REMOTE_ADDRESS%"
      clusters:
        - name: identity_service
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: identity_service
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: identity-service.nexora.svc.cluster.local
                          port_value: 8081
          health_checks:
            - timeout: 5s
              interval: 10s
              unhealthy_threshold: 3
              healthy_threshold: 1
              http_health_check:
                path: /health
          circuit_breakers:
            thresholds:
