apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: nexora
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: nexora
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
  selector:
    app.kubernetes.io/name: cassandra
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: nexora
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: nexora
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cassandra
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cassandra
        app.kubernetes.io/part-of: nexora
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cassandra
          image: cassandra:4.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: cql
              containerPort: 9042
              protocol: TCP
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: "NexoraCluster"
            - name: CASSANDRA_DC
              value: "dc1"
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: "GossipingPropertyFileSnitch"
            - name: CASSANDRA_HEAP_NEWSIZE
              value: "128M"
            - name: CASSANDRA_MAX_HEAP_SIZE
              value: "512M"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            exec:
              command:
                - cqlsh
                - -e
                - "DESCRIBE KEYSPACES;"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra
            - name: cassandra-init
              mountPath: /docker-entrypoint-initdb.d
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: cassandra-init
          configMap:
            name: cassandra-init-script
  volumeClaimTemplates:
    - metadata:
        name: cassandra-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cassandra-init-script
  namespace: nexora
  labels:
    app.kubernetes.io/name: cassandra
    app.kubernetes.io/part-of: nexora
data:
  init.sh: |
    #!/bin/bash
    set -e
    MAX_RETRIES=30
    RETRY_INTERVAL=2
    echo "Waiting for Cassandra..."
    for i in $(seq 1 $MAX_RETRIES); do
      if cqlsh localhost 9042 -e "DESCRIBE KEYSPACES;" >/dev/null 2>&1; then
        echo "Cassandra is ready."
        break
      fi
      echo "Attempt $i/$MAX_RETRIES - retrying in ${RETRY_INTERVAL}s..."
      sleep $RETRY_INTERVAL
    done
    echo "Cassandra init complete."
