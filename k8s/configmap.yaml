apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-config
  namespace: nexora
  labels:
    app.kubernetes.io/part-of: nexora
data:
  SERVICE_PORT: "8080"
  CASSANDRA_HOSTS: "cassandra.nexora.svc.cluster.local"
  CASSANDRA_KEYSPACE: "nexora"
  KAFKA_BROKERS: "kafka.nexora.svc.cluster.local:9092"
  JWT_ACCESS_TTL: "3600"
  JWT_REFRESH_TTL: "604800"
  OTP_TTL: "300"
  LOG_LEVEL: "info"
  GIN_MODE: "release"
