static_resources:
  listeners:
    - name: main_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                codec_type: AUTO
                stat_prefix: ingress_http
                use_remote_address: true
                generate_request_id: true
                common_http_protocol_options:
                  idle_timeout: 300s
                request_timeout: 30s
                stream_idle_timeout: 300s
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  # Authentication is enforced at each service ORIGIN by the
                  # shared/auth middleware (shared JWT secret + internal
                  # service token). The edge routes + terminates; it does not
                  # duplicate token verification so the crypto provider stays
                  # in one place and direct-port calls are equally protected.
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        # ── Auth ──
                        - match:
                            prefix: /v1/auth
                          route:
                            cluster: identity_service
                            timeout: 30s
                            retry_policy:
                              retry_on: "503"
                              num_retries: 2
                              per_try_timeout: 5s
                          request_headers_to_add:
                            - header:
                                key: x-request-id
                                value: "%REQ(x-request-id)%"

                        # ── Users ──
                        - match:
                            prefix: /v1/users
                          route:
                            cluster: user_service
                            timeout: 30s

                        # ── Accounts ──
                        - match:
                            prefix: /v1/accounts
                          route:
                            cluster: account_service
                            timeout: 30s

                        # ── Ledger ──
                        - match:
                            prefix: /v1/ledger
                          route:
                            cluster: ledger_service
                            timeout: 30s

                        # ── Payments ──
                        - match:
                            prefix: /v1/payments
                          route:
                            cluster: payment_service
                            timeout: 120s
                            retry_policy:
                              retry_on: "503"
                              num_retries: 2
                              per_try_timeout: 30s

                        # ── Transfers ──
                        - match:
                            prefix: /v1/transfers
                          route:
                            cluster: transfer_service
                            timeout: 120s
                            retry_policy:
                              retry_on: "503"
                              num_retries: 2
                              per_try_timeout: 30s

                        # ── Cards ──
                        - match:
                            prefix: /v1/cards
                          route:
                            cluster: card_service
                            timeout: 30s

                        # ── Pots ──
                        - match:
                            prefix: /v1/pots
                          route:
                            cluster: pot_service
                            timeout: 30s

                        # ── Notifications ──
                        - match:
                            prefix: /v1/notifications
                          route:
                            cluster: notification_service
                            timeout: 30s

                        # ── Realtime (SSE stream + feed) ──
                        - match:
                            prefix: /v1/stream
                          route:
                            cluster: notification_service
                            timeout: 0s
                            idle_timeout: 0s
                        - match:
                            prefix: /v1/feed
                          route:
                            cluster: notification_service
                            timeout: 30s

                        # ── Insights (Financial Intelligence Platform) ──
                        - match:
                            prefix: /v1/insights
                          route:
                            cluster: insights_service
                            timeout: 30s

                        # ── Disputes (chargeback orchestration) ──
                        - match:
                            prefix: /v1/disputes
                          route:
                            cluster: dispute_service
                            timeout: 30s

                        # ── Delegated access + consent ──
                        - match:
                            prefix: /v1/consent
                          route:
                            cluster: consent_service
                            timeout: 30s

                        # ── Security / Control Plane ──
                        - match:
                            prefix: /v1/security
                          route:
                            cluster: control_plane_service
                            timeout: 30s

                        # ── Engineering / Replay ──
                        - match:
                            prefix: /v1/engineering
                          route:
                            cluster: replay_service
                            timeout: 30s

                        # ── Simulations ──
                        - match:
                            prefix: /v1/simulations
                          route:
                            cluster: simulation_service
                            timeout: 60s

                        # ── Policies ──
                        - match:
                            prefix: /v1/policies
                          route:
                            cluster: policy_service
                            timeout: 30s

                        # ── Reconciliation ──
                        - match:
                            prefix: /v1/reconciliation
                          route:
                            cluster: reconciliation_service
                            timeout: 60s

                        # ── Incidents ──
                        - match:
                            prefix: /v1/incidents
                          route:
                            cluster: incident_service
                            timeout: 30s

                        # ── Chaos ──
                        - match:
                            prefix: /v1/chaos
                          route:
                            cluster: simulation_service
                            timeout: 60s

                        # ── Health ──
                        - match:
                            prefix: /v1/health
                          route:
                            cluster: control_plane_service
                            timeout: 5s

                        # ── Control plane (dependency health graph + throttle) ──
                        - match:
                            prefix: /v1/control
                          route:
                            cluster: control_plane_service
                            timeout: 10s

                        # ── Default 404 ──
                        - match:
                            prefix: /
                          direct_response:
                            status: 404
                            body:
                              inline_string: '{"error":"not_found","message":"The requested endpoint does not exist."}'

                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          timestamp: "%START_TIME%"
                          request_id: "%REQ(x-request-id)%"
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(:PATH)%"
                          protocol: "%PROTOCOL%"
                          response_code: "%RESPONSE_CODE%"
                          response_flags: "%RESPONSE_FLAGS%"
                          duration_ms: "%DURATION%"
                          upstream_cluster: "%UPSTREAM_CLUSTER%"
                          upstream_host: "%UPSTREAM_HOST%"
                          upstream_response_code: "%RESP(x-envoy-upstream-service-time)%"
                          request_size: "%BYTES_RECEIVED%"
                          response_size: "%BYTES_SENT%"
                          user_agent: "%REQ(USER-AGENT)%"
                          source_ip: "%DOWNSTREAM_REMOTE_ADDRESS%"
                          authority: "%REQ(:AUTHORITY)%"

  clusters:
    - name: identity_service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: identity_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: identity-service
                      port_value: 8081
      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 1
          http_health_check:
            path: /health
      circuit_breakers:
        thresholds:
          - max_connections: 1024
            max_pending_requests: 512
            max_requests: 1024
            max_retries: 3

