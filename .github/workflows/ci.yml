name: Nexora CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25'
  JAVA_VERSION: '17'

jobs:
  go-lint:
    name: Go Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go mod tidy
        run: go mod tidy
      # Each service and the shared library is its own module, so vetting from
      # the root would only cover the root packages (kafka/, tests/).
      - name: Go vet (root + every module)
        run: |
          set -e
          go vet ./...
          for mod in $(find services shared -name go.mod -exec dirname {} \; | sort); do
            echo "::group::go vet $mod"
            (cd "$mod" && go vet ./...)
            echo "::endgroup::"
          done
      - name: Go fmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Root module tests (unit + contract)
        run: go test -race ./...
      - name: Shared platform suites
        working-directory: shared
        run: go test -race ./...
      # Services are separate modules: `go test ./...` from the repo root skips
      # every one of them, so the loop runs each module's own suites (core
      # service-layer tests, financial invariants, contract tests).
      - name: Service module tests
        run: |
          set -e
          for mod in $(find services -name go.mod -exec dirname {} \; | sort); do
            echo "::group::go test $mod"
            (cd "$mod" && go test -race ./...)
            echo "::endgroup::"
          done

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Services are separate modules, so a root-level `go build ./services/...`
      # does not build them ("main module does not contain package"). Build each
      # module from inside its own directory.
      - name: Build every module
        run: |
          set -e
          go build ./...
          for mod in $(find services shared -name go.mod -exec dirname {} \; | sort); do
            echo "::group::go build $mod"
            (cd "$mod" && go build ./...)
            echo "::endgroup::"
          done

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-debug
          path: android/app/build/outputs/apk/debug/*.apk

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          set -e
          # Every Dockerfile copies shared/ and services/<svc>/, so the build
          # context must be the repository root, not the service directory
          # (same as docker-compose.yml).
          for dockerfile in services/*/Dockerfile; do
            svc=$(basename "$(dirname "$dockerfile")")
            echo "Building $svc..."
            docker build -t "nexora/$svc:test" -f "$dockerfile" .
          done

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run go vet
        run: go vet ./...
      # Only assignments of a string literal are secrets. Reading a value out of
      # state, or declaring the field, is not. Tests are excluded because
      # fixtures legitimately carry dummy credentials.
      - name: Check for secrets
        run: |
          hits=$(grep -rEn '(password|passwd|pwd|secret|token|apikey|api_key)[[:space:]]*=[[:space:]]*["][^"]+["]' \
            --include="*.go" --include="*.kt" --include="*.yaml" --include="*.yml" --include="*.properties" \
            --exclude="*_test.go" --exclude-dir=.tools . || true)
          if [ -n "$hits" ]; then
            echo "Potential hardcoded secrets found:"
            echo "$hits"
            exit 1
          fi
      # Money is integer minor units. This flags a float field whose identifier
      # *ends* in a money word, so percentages, scores and latencies stay legal
      # while `Amount float64` does not.
      - name: Check for float in financial code
        run: |
          hits=$(grep -rEn '\b[A-Za-z_]*(Amount|Balance|Fee|Charge|Refund|Price|Minor|Major|Debit|Credit|Money|Payment|Pence|Cents|Cost)[[:space:]]+float(64|32)\b' \
            --include="*.go" services/*/internal/domain/ services/*/internal/service/ shared/money/ || true)
          if [ -n "$hits" ]; then
            echo "Potential floating-point money in financial code:"
            echo "$hits"
            exit 1
          fi
