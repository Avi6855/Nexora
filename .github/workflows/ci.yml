name: Nexora CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25'
  JAVA_VERSION: '17'

jobs:
  go-lint:
    name: Go Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go mod tidy
        run: go mod tidy
      # Each service and the shared library is its own module, so vetting from
      # the root would only cover the root packages (kafka/, tests/).
      - name: Go vet (root + every module)
        run: |
          set -e
          go vet ./...
          for mod in $(find services shared -name go.mod -exec dirname {} \; | sort); do
            echo "::group::go vet $mod"
            (cd "$mod" && go vet ./...)
            echo "::endgroup::"
          done
      - name: Go fmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Root module tests (unit + contract)
        run: go test -race ./...
      - name: Shared platform suites
        working-directory: shared
        run: go test -race ./...
      # Services are separate modules: `go test ./...` from the repo root skips
      # every one of them, so the loop runs each module's own suites (core
      # service-layer tests, financial invariants, contract tests).
      - name: Service module tests
        run: |
          set -e
          for mod in $(find services -name go.mod -exec dirname {} \; | sort); do
            echo "::group::go test $mod"
            (cd "$mod" && go test -race ./...)
            echo "::endgroup::"
          done

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # Services are separate modules, so a root-level `go build ./services/...`
      # does not build them ("main module does not contain package"). Build each
      # module from inside its own directory.
      - name: Build every module
        run: |
          set -e
          go build ./...
          for mod in $(find services shared -name go.mod -exec dirname {} \; | sort); do
            echo "::group::go build $mod"
            (cd "$mod" && go build ./...)
            echo "::endgroup::"
          done

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-debug
          path: android/app/build/outputs/apk/debug/*.apk

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          for dir in services/*/; do
            if [ -f "$dir/Dockerfile" ]; then
              echo "Building $(basename $dir)..."
              docker build -t nexora/$(basename $dir):test $dir
            fi
          done

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run go vet
        run: go vet ./...
      - name: Check for secrets
        run: |
          if grep -r "password\s*=" --include="*.go" --include="*.kt" --include="*.yaml" . | grep -v "password_hash" | grep -v "PasswordHash" | grep -v ".env.example" | grep -v "test"; then
            echo "WARNING: Potential hardcoded passwords found"
            exit 1
          fi
      - name: Check for float in financial code
        run: |
          if grep -r "float64\|float32" --include="*.go" services/*/internal/domain/ services/*/internal/service/ shared/money/ | grep -v "MajorUnits\|Display\|FraudScore\|RiskScore\|format\|_test.go"; then
            echo "WARNING: Potential floating-point in financial code"
            exit 1
          fi
