name: Nexora CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25'
  JAVA_VERSION: '17'

jobs:
  go-lint:
    name: Go Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Go mod tidy
        run: go mod tidy
      - name: Go vet
        run: go vet ./...
      - name: Go fmt check
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run unit tests
        run: go test -v -race ./tests/unit/...
      - name: Run ledger service tests (integration + financial invariants)
        working-directory: services/ledger-service
        run: go test -v -race ./tests/...
      - name: Run payment service tests
        working-directory: services/payment-service
        run: go test -v -race ./tests/...
      - name: Run contract tests
        run: go test -v -race ./tests/contract/...

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build all services
        run: |
          for dir in services/*/; do
            if [ -f "$dir/cmd/main.go" ]; then
              echo "Building $(basename $dir)..."
              go build -o /dev/null ./$dir/cmd/
            fi
          done

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexora-debug
          path: android/app/build/outputs/apk/debug/*.apk

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          for dir in services/*/; do
            if [ -f "$dir/Dockerfile" ]; then
              echo "Building $(basename $dir)..."
              docker build -t nexora/$(basename $dir):test $dir
            fi
          done

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run go vet
        run: go vet ./...
      - name: Check for secrets
        run: |
          if grep -r "password\s*=" --include="*.go" --include="*.kt" --include="*.yaml" . | grep -v "password_hash" | grep -v "PasswordHash" | grep -v ".env.example" | grep -v "test"; then
            echo "WARNING: Potential hardcoded passwords found"
            exit 1
          fi
      - name: Check for float in financial code
        run: |
          if grep -r "float64\|float32" --include="*.go" services/*/internal/domain/ services/*/internal/service/ shared/money/ | grep -v "MajorUnits\|Display\|FraudScore\|RiskScore\|format\|_test.go"; then
            echo "WARNING: Potential floating-point in financial code"
            exit 1
          fi
