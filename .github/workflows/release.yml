name: Nexora Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      # Services are separate modules, so each must be built from its own
      # directory (same as ci.yml).
      - name: Build Go services
        run: |
          set -e
          for mod in $(find services -name go.mod -exec dirname {} \; | sort); do
            svc=$(basename "$mod")
            echo "Building $svc..."
            (cd "$mod" && CGO_ENABLED=0 GOOS=linux go build -o /tmp/nexora-$svc ./cmd/)
          done
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
