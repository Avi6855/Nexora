  # ── API Gateway ─────────────────────────────────────────────────────────────
  envoy:
    image: envoyproxy/envoy:v1.29-latest
    container_name: nexora-envoy
    depends_on:
      identity-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      transfer-service:
        condition: service_healthy
      card-service:
        condition: service_healthy
      pot-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      control-plane-service:
        condition: service_healthy
      replay-service:
        condition: service_healthy
      simulation-service:
        condition: service_healthy
      policy-service:
        condition: service_healthy
      reconciliation-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "9901:9901"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - nexora-network
    command: ["-c", "/etc/envoy/envoy.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf \"GET /ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" > /dev/tcp/localhost/9901'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  cassandra-data:
    driver: local

networks:
  nexora-network:
    driver: bridge
