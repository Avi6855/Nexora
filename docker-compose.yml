  # ── API Gateway ─────────────────────────────────────────────────────────────
  envoy:
    image: envoyproxy/envoy:v1.29-latest
    container_name: nexora-envoy
    depends_on:
      identity-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      ledger-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      transfer-service:
        condition: service_healthy
      card-service:
        condition: service_healthy
      pot-service:
        condition: service_healthy
      insights-service:
        condition: service_healthy
      dispute-service:
        condition: service_healthy
      consent-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      control-plane-service:
        condition: service_healthy
      replay-service:
        condition: service_healthy
      simulation-service:
        condition: service_healthy
      policy-service:
        condition: service_healthy
      reconciliation-service:
        condition: service_healthy
      incident-service:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "127.0.0.1:9901:9901"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - nexora-network
    command: ["-c", "/etc/envoy/envoy.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf \"GET /ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" > /dev/tcp/localhost/9901'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: nexora-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - nexora-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: nexora-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: monzo
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - nexora-network
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cassandra-data:
    driver: local

networks:
  nexora-network:
    driver: bridge
